[project]
name = "villena-pipeline"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "geopandas==1.2.0", "pyogrio==0.13.0", "rasterio==1.5.2", "shapely==2.2.0",
  "pyproj==3.8.0", "numpy==2.5.4", "pillow==13.0.0", "jsonschema==4.26.0", "requests==2.34.2",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.5"]

[tool.uv]
package = false
no-build = true

[tool.ruff]
line-length = 120
