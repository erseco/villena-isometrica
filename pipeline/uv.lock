    { name = "jsonschema" },
    { name = "numpy" },
    { name = "pillow" },
    { name = "pyogrio" },
    { name = "pyproj" },
    { name = "rasterio" },
    { name = "requests" },
    { name = "shapely" },
]

[package.dev-dependencies]
dev = [
    { name = "pytest" },
    { name = "ruff" },
]

[package.metadata]
requires-dist = [
    { name = "geopandas", specifier = "==1.2.0" },
    { name = "jsonschema", specifier = "==4.26.0" },
    { name = "numpy", specifier = "==2.5.4" },
    { name = "pillow", specifier = "==13.0.0" },
    { name = "pyogrio", specifier = "==0.13.0" },
    { name = "pyproj", specifier = "==3.8.0" },
    { name = "rasterio", specifier = "==1.5.2" },
    { name = "requests", specifier = "==2.34.2" },
    { name = "shapely", specifier = "==2.2.0" },
]

[package.metadata.requires-dev]
dev = [
    { name = "pytest", specifier = "==9.2.0" },
    { name = "ruff", specifier = "==0.17.5" },
]
