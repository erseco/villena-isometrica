name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  # No tile release yet -> nothing to deploy: skip (not fail) until the lock exists.
  guard:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.lock.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: lock
        run: |
          if [ -f cities/villena/tiles.lock.json ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "::notice::No cities/villena/tiles.lock.json yet; deployment skipped."; fi
  build:
    needs: guard
    if: needs.guard.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # make check runs bun lint, which only ships in Bun canary so far (ADR 0009).
          bun-version: canary
      - run: make install check
      - run: |
          if [ -f apps/viewer/package.json ]; then
            cd apps/viewer
            bun run fixture
            VITE_BASE=/villena-isometrica/ bun run build
            bunx --bun playwright install --with-deps chromium
            bun run e2e
          fi
      # the e2e fixture city must not be published
      - run: rm -rf apps/viewer/public/tiles/planeville apps/viewer/dist
      - run: make fetch-tiles
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - run: make build size-check
      - run: test -z "$(find apps/viewer/dist \( -type l -o \( -type f -links +1 \) \) -print -quit)"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/viewer/dist
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
